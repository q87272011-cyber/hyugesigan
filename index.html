<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>휴게시간</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one drawn cross-section (homes and an empty storeroom above; boiler room | wall | break room below). Four nights as moon buttons, three lane buttons for the three pads on the wall. A three-lane rhythm game with no words: sounds are waves and synthesized audio. Single dark look by choice. */
:root {
  --bg: #0e100f;
  --ink: #e7e3d9;
  --line: #2c312e;
  --machine: #a8e08a;
  --phone: #9fd086;
  --boiler: #e3884c;
  --pipe: #e8d6a8;
  --pump: #9fb7ad;
  --sleep: #a99fdc;
  --clock: #e2725f;
  --f-story: "Gowun Batang", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 28px;
  -webkit-user-select: none; user-select: none;
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.nights { display: flex; gap: 8px; }
.night { width: 40px; height: 40px; padding: 0; border-radius: 50%; display: grid; place-items: center; background: #1c201e; border: 1px solid var(--line); cursor: pointer; }
.night svg { display: block; }
.night[aria-current="true"] { border-color: var(--sleep); box-shadow: 0 0 0 2px rgba(169,159,220,0.35); }
.night.next { animation: beckon 1.2s ease-in-out infinite; }
.night:disabled { opacity: 0.3; cursor: default; }
@keyframes beckon { 50% { box-shadow: 0 0 0 6px rgba(169,159,220,0.25); } }
.scene { border-radius: 4px; overflow: hidden; border: 2px solid #2a2f24; background: #0d0f0c; }
.scene canvas { display: block; width: 100%; touch-action: none; cursor: crosshair; image-rendering: pixelated; }
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.btns { display: flex; gap: 6px; }
button { font: inherit; font-size: 14px; border-radius: 9px; padding: 8px 12px; cursor: pointer; border: 1px solid var(--line); background: #1c201e; color: var(--ink); min-width: 42px; }
button.go { background: var(--machine); border-color: var(--machine); color: #0f1517; font-weight: 500; }
button.ring { background: var(--phone); border-color: var(--phone); color: #111a0d; }
button:disabled { opacity: 0.35; cursor: default; }
button:focus-visible { outline: 2px solid var(--boiler); outline-offset: 2px; }
.lanes { flex: 1 1 300px; display: flex; gap: 8px; }
.lane { flex: 1; height: 60px; border-radius: 6px; display: grid; place-items: center; background: #171c16; border: 2px solid var(--lc); touch-action: none; transition: background 60ms; }
.lane svg { display: block; }
.lane.down { background: #2d4a2a; }
.lane.cue { box-shadow: 0 0 0 6px color-mix(in srgb, var(--lc) 40%, transparent); }
.lane:disabled { border-color: var(--line); }
@media (prefers-reduced-motion: reduce) { .night.next { animation: none; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="nights" id="nights">
    <button class="night" type="button" data-n="0" aria-label="첫째 밤"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="none" stroke="#a99fdc" stroke-width="1.4"/><path d="M11 2a9 9 0 0 1 0 18a6 9 0 0 0 0-18z" fill="#a99fdc"/></svg></button>
    <button class="night" type="button" data-n="1" aria-label="둘째 밤" disabled><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="none" stroke="#a99fdc" stroke-width="1.4"/><path d="M11 2a9 9 0 0 1 0 18z" fill="#a99fdc"/></svg></button>
    <button class="night" type="button" data-n="2" aria-label="셋째 밤" disabled><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="none" stroke="#a99fdc" stroke-width="1.4"/><path d="M11 2a9 9 0 0 1 0 18a4 9 0 0 1 0-18z" fill="#a99fdc"/></svg></button>
    <button class="night" type="button" data-n="3" aria-label="넷째 밤" disabled><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="#a99fdc"/></svg></button>
  </div>
  <div class="scene" id="scene">
    <canvas id="cv" aria-label="아파트 단면. 지하 보일러실의 배관, 보일러, 펌프에서 오는 파동이 휴게실 벽의 세 자리를 때린다. 파동이 닿는 순간 그 높이를 누르면 반대 파동이 흩트린다."></canvas>
  </div>
  <div class="strip">
    <div class="btns">
      <button class="go" id="playBtn" type="button" aria-label="휴게 시작">▶</button>
      <button id="resetBtn" type="button" aria-label="이 밤 처음부터">↺</button>
      <button id="muteBtn" type="button" aria-pressed="false" aria-label="소리 끄기"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 7h3l4-3v10l-4-3H2z" fill="currentColor"/><path id="muteWaves" d="M12 6q2 3 0 6M14 4q4 5 0 10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </div>
    <div class="lanes">
      <button class="lane" data-lane="0" type="button" style="--lc:#e8d6a8" aria-label="위쪽 패드: 배관 (W 또는 ↑)" disabled><svg width="44" height="22" viewBox="0 0 44 22" aria-hidden="true"><rect x="2" y="8" width="40" height="6" rx="2" fill="#e8d6a8" opacity=".5"/><path d="M14 4l4 7-4 7M26 4l4 7-4 7" fill="none" stroke="#e8d6a8" stroke-width="2"/></svg></button>
      <button class="lane" data-lane="1" type="button" style="--lc:#e3884c" aria-label="가운데 패드: 보일러 (S, 스페이스)" disabled><svg width="44" height="22" viewBox="0 0 44 22" aria-hidden="true"><path d="M8 3a12 12 0 0 1 0 16M16 1a18 18 0 0 1 0 20M24 3a12 12 0 0 1 0 16" fill="none" stroke="#e3884c" stroke-width="2.4"/></svg></button>
      <button class="lane" data-lane="2" type="button" style="--lc:#9fb7ad" aria-label="아래쪽 패드: 펌프 (X 또는 ↓)" disabled><svg width="44" height="22" viewBox="0 0 44 22" aria-hidden="true"><circle cx="12" cy="11" r="7" fill="none" stroke="#9fb7ad" stroke-width="2"/><path d="M12 4v14M5 11h14" stroke="#9fb7ad" stroke-width="1.6"/><path d="M24 15q4-8 8 0t8 0" fill="none" stroke="#9fb7ad" stroke-width="2"/></svg></button>
    </div>
    <button class="ring" id="answerBtn" type="button" disabled aria-label="인터폰 받기">☎</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), mctx = cv.getContext('2d');
  let ctx = mctx;
  const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = { ink: tok('--ink'), boiler: tok('--boiler'), pipe: tok('--pipe'), pump: tok('--pump'), mach: tok('--machine'), phone: tok('--phone'), sleep: tok('--sleep'), clock: tok('--clock'), mute: '#8a918b' };
  const LANE_C = [C.pipe, C.boiler, C.pump];
  const SERIF = tok('--f-story'), MONO = tok('--f-num');

  // ---------- design
  // Before the break: 10 s of free play (23:59 → 00:00), nothing you do or don't do costs anything.
  // Then the break: 240 game minutes = 180 s. Three lanes hit three pads on the wall:
  // 0 pipe (top, metallic ticks), 1 boiler (middle, hum and the burner's roar), 2 pump (bottom, a low thump).
  const SANDBOX = 10, GMPS = 240 / 180, BURN_GM = 10;
  const PUMP_E = 0.4, BURN_E = 0.3, COUNT = 3, APPROACH = 1.3;
  const RING_GM = 12, CALL_AWAKE_GM = 8;
  // bar patterns: [eighth, lane] pairs, 8 eighths per bar; denser ones appear later in the night
  const PUMP_PAT = [
    [[0, 1], [4, 2]],
    [[0, 2], [4, 1], [6, 2]],
    [[0, 1], [3, 2], [6, 1]],
    [[0, 1], [2, 0], [4, 2], [6, 0]],
    [[0, 2], [3, 2], [4, 1]],
    [[1, 0], [2, 0], [4, 1], [6, 2]],
    [[0, 1], [2, 1], [3, 0], [5, 2], [6, 1]],
    [[0, 2], [1, 0], [3, 1], [4, 2], [6, 0], [7, 0]],
  ];
  const BURN_PAT = [
    [[0, 1], [2, 1], [4, 1], [6, 2]],
    [[0, 1], [1, 0], [2, 1], [4, 2], [5, 1], [7, 0]],
    [[0, 1], [2, 0], [3, 0], [4, 1], [6, 0]],
    [[0, 1], [2, 1], [3, 2], [4, 1], [5, 0], [6, 1], [7, 2]],
  ];
  const LEVELS = [
    { end: 60,  ign: [],                  calls: [],             guide: 3, win: [0.10, 0.22], dens: [0.25, 0.5] },
    { from: 60,  end: 90,  ign: [18, 58],            calls: [],             guide: 2, win: [0.10, 0.22], dens: [0.15, 0.5] },
    { from: 120, end: 120, ign: [14, 50, 86],        calls: [62],           guide: 1, win: [0.08, 0.18], dens: [0.3, 0.75] },
    { end: 240, ign: [22, 55.7, 87.1, 116.2, 143.3, 168.4, 191.8, 213.5], calls: [40, 110, 190], guide: 0, win: [0.07, 0.15], dens: [0.35, 1] },
  ];
  // sleep beside a boiler is never deep: depth tops out at 60, so an off-beat knock can still wake him
  // and it deepens on its own whenever the room stays quiet for a moment
  const DEPTH = { perfect: 1, good: 0, miss: -14, holdMiss: -20, holdBreak: -8, holdDone: 3, empty: -3, knock: -14, max: 60, calm: 4, calmAfter: 1.2 };

  // what the nights leave behind: his pencil line per night, slips that nobody clears, calls that come back sooner
  let level = 0, unlocked = 0, S;
  const nightLog = [];
  let slipsKept = 0, owed = 0;
  const L = () => LEVELS[level];
  function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

  function buildChart(lv, seed) {
    const r = rng(seed), notes = [], cues = [], burns = [];
    const t0 = SANDBOX, endT = t0 + lv.end / GMPS;
    // free play: soft, sparse, harmless
    for (let t = 1.4; t < SANDBOX - 0.8; t += 0.9 + r() * 0.7) notes.push({ t, lane: [1, 2, 0, 1, 2][notes.length % 5], kind: 'soft', free: true });
    const pick = (pats, prog) => { const d = lv.dens[0] + (lv.dens[1] - lv.dens[0]) * prog; const n = Math.max(1, Math.round(d * pats.length)); return pats[Math.floor(r() * n)]; };
    const addBars = (from, until, e, pats, kind) => {
      let t = from;
      for (; t + 8 * e <= until + 1e-6 || t < until - 0.2; t += 8 * e) {
        const pat = pick(pats, (t - t0) / (endT - t0));
        pat.forEach(([k, lane]) => { const tn = t + k * e; if (tn < until - 0.15) notes.push({ t: tn, lane, kind: kind === 'burn' && lane === 1 ? 'burn' : 'tap' }); });
        if (t + 8 * e > until) break;
      }
    };
    let t = t0 + 0.8;
    lv.ign.forEach(g => {
      const tI = t0 + g / GMPS, tEnd = Math.min(endT, t0 + (g + BURN_GM) / GMPS);
      addBars(t, tI - COUNT * 2 * BURN_E - 0.3, PUMP_E, PUMP_PAT, 'pump');
      for (let k = COUNT; k >= 1; k--) cues.push({ t: tI - k * 2 * BURN_E });
      notes.push({ t: tI, lane: 1, kind: 'hold', end: tI + 8 * BURN_E });
      addBars(tI + 8 * BURN_E + 2 * BURN_E, tEnd, BURN_E, BURN_PAT, 'burn');
      burns.push([tI, tEnd]);
      t = tEnd + 2 * PUMP_E;
    });
    addBars(t, endT - 0.4, PUMP_E, PUMP_PAT, 'pump');
    notes.sort((a, b) => a.t - b.t);
    return { notes, cues, burns, t0, endT };
  }

  const fresh = () => {
    const lv = L(), ch = buildChart(lv, 1234 + level * 77);
    // last night's unanswered calls come back tonight, wedged between the usual ones
    const calls = lv.calls.slice();
    if (calls.length) for (let i = 0; i < Math.min(2, owed); i++) calls.push(Math.round(lv.end * (i + 1.5) / 4));
    calls.sort((a, b) => a - b);
    return {
      calls, followUps: 0, homeLit: [-99, -99],
      mode: 'ready', started: false, t: 0, gm: 0, rest: false,
      ...ch, ci: 0, ni: 0,
      depth: 20, slept: 0, asleep: false, sleepMin: new Uint8Array(240),
      hit: { cause: 'hum', gm: -99 }, breaks: [],
      down: [false, false, false], holdNote: null, wall: [0, 0, 0], thud: 0,
      ring: null, callIdx: 0, nextRingT: 0, awakeUntil: -1, answered: 0, missed: 0,
      knockAt: SANDBOX + 3 + Math.random() * 4, combo: 0, quietAt: SANDBOX,
      sitting: false, sitT: -9, flinchT: -9, padMiss: [-9, -9, -9], breathAt: 0, workMin: new Uint8Array(240), slipT: [],
    };
  };
  const burningAt = t => S.burns.some(([a, b]) => t >= a && t < b);
  const hm = g => { const m = Math.floor(g); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  const setHit = cause => { S.hit = { cause, gm: S.gm }; };

  // ---------- audio: everything synthesized
  const A = { ctx: null, master: null, lp: null, hum: null, rumble: null, noise: null, muted: false };
  function audioInit() {
    if (A.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const c = A.ctx = new AC();
      A.lp = c.createBiquadFilter(); A.lp.type = 'lowpass'; A.lp.frequency.value = 9000;
      A.master = c.createGain(); A.master.gain.value = A.muted ? 0 : 0.8;
      A.lp.connect(A.master); A.master.connect(c.destination);
      const buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      A.noise = buf;
      const o = c.createOscillator(); o.frequency.value = 50; const g = c.createGain(); g.gain.value = 0.04; o.connect(g); g.connect(A.lp); o.start(); A.hum = { o, g };
      const n = c.createBufferSource(); n.buffer = buf; n.loop = true; const bp = c.createBiquadFilter(); bp.type = 'lowpass'; bp.frequency.value = 160;
      const rg = c.createGain(); rg.gain.value = 0; n.connect(bp); bp.connect(rg); rg.connect(A.lp); n.start(); A.rumble = rg;
    } catch (e) { A.ctx = null; }
  }
  const at = t => A.ctx ? A.ctx.currentTime + Math.max(0, t - S.t) : 0;
  function tone(when, type, f, gain, dur, f2) {
    if (!A.ctx) return null;
    const c = A.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, when); if (f2) o.frequency.exponentialRampToValueAtTime(f2, when + dur);
    g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(gain, when + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(A.lp); o.start(when); o.stop(when + dur + 0.05); return g;
  }
  function noise(when, filt, f, q, gain, dur) {
    if (!A.ctx) return null;
    const c = A.ctx, s = c.createBufferSource(), b = c.createBiquadFilter(), g = c.createGain();
    s.buffer = A.noise; b.type = filt; b.frequency.value = f; b.Q.value = q;
    g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(gain, when + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    s.connect(b); b.connect(g); g.connect(A.lp); s.start(when, Math.random()); s.stop(when + dur + 0.05); return g;
  }
  // one incoming wave per lane; it swells to its loudest as it reaches the wall
  function incoming(when, lane, kind) {
    if (!A.ctx) return null;
    const soft = kind === 'soft' ? 0.45 : 1;
    const c = A.ctx, o = c.createOscillator(), g = c.createGain();
    const spec = [{ f: 740, type: 'triangle', peak: 0.07, pre: 0.12 }, { f: kind === 'burn' ? 66 : 54, type: 'sine', peak: kind === 'burn' ? 0.42 : 0.32, pre: 0.3 }, { f: 40, type: 'sine', peak: 0.45, pre: 0.18 }][lane];
    o.type = spec.type; o.frequency.value = spec.f;
    g.gain.setValueAtTime(0.0001, when - spec.pre); g.gain.exponentialRampToValueAtTime(spec.peak * soft, when); g.gain.exponentialRampToValueAtTime(0.0001, when + 0.35);
    o.connect(g); g.connect(A.lp); o.start(when - spec.pre - 0.01); o.stop(when + 0.4);
    if (lane === 0) { noise(when, 'bandpass', 3000, 9, 0.18 * soft, 0.04); noise(when - 0.22, 'bandpass', 900, 0.9, 0.05 * soft, 0.26); }
    return g;
  }
  function roar(when, dur) {
    if (!A.ctx) return null;
    tone(when, 'sine', 70, 0.7, 0.5, 32);
    const c = A.ctx, s = c.createBufferSource(), b = c.createBiquadFilter(), g = c.createGain();
    s.buffer = A.noise; s.loop = true; b.type = 'lowpass'; b.frequency.value = 260;
    g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(0.5, when + 0.05); g.gain.setValueAtTime(0.5, when + dur - 0.1); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    s.connect(b); b.connect(g); g.connect(A.lp); s.start(when); s.stop(when + dur + 0.05); return g;
  }
  const hush = (g, f) => { if (!g || !A.ctx) return; const now = A.ctx.currentTime; g.gain.cancelScheduledValues(now); g.gain.setTargetAtTime(0.0001 + f * 0.2, now, 0.03); };
  // each pad answers with its own note: hitting in rhythm makes a small tune (pentatonic, shifts with the burner)
  const PAD_NOTE = [[1318, 1174, 1568], [880, 784, 988], [659, 587, 740]];
  const sfx = {
    click: w => tone(w, 'square', 2200, 0.07, 0.04),
    chime: (w, lane, perfect, step) => { const f = PAD_NOTE[lane][step % 3]; tone(w, 'sine', f, perfect ? 0.09 : 0.05, 0.45); if (perfect) tone(w + 0.015, 'sine', f * 1.5, 0.03, 0.3); noise(w, 'bandpass', 5200, 3, 0.04, 0.1); },
    thump: w => noise(w, 'lowpass', 220, 0.7, 0.35, 0.25),
    buzz: w => tone(w, 'square', 110, 0.04, 0.08),
    knock: w => { noise(w, 'bandpass', 2600, 8, 0.5, 0.05); tone(w, 'sine', 1300, 0.06, 0.18); },
    ring: w => { for (let k = 0; k < 6; k++) tone(w + k * 0.07, 'triangle', k % 2 ? 1100 : 880, 0.06, 0.06); },
    beep: w => tone(w, 'sine', 1600, 0.09, 0.14),
    sour: w => { tone(w, 'sawtooth', 92, 0.06, 0.3); tone(w, 'sawtooth', 98, 0.06, 0.3); },
    bulb: w => { tone(w, 'square', 3200, 0.05, 0.02); noise(w + 0.01, 'highpass', 4000, 1, 0.04, 0.05); },
    slip: w => noise(w, 'bandpass', 1800, 1.2, 0.05, 0.35),
    breath: w => {
      if (!A.ctx) return;
      const c = A.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      src.buffer = A.noise; f.type = 'bandpass'; f.frequency.value = 520; f.Q.value = 0.8;
      g.gain.setValueAtTime(0.0001, w); g.gain.exponentialRampToValueAtTime(0.05, w + 0.6); g.gain.exponentialRampToValueAtTime(0.0001, w + 1.5);
      src.connect(f); f.connect(g); g.connect(A.lp); src.start(w, Math.random()); src.stop(w + 1.6);
    },
  };
  function audioPause(on) { if (!A.ctx) return; try { on ? A.ctx.suspend() : A.ctx.resume(); } catch (e) {} }
  const clock = { base: 0, mark: 0, src: '' };
  const srcNow = () => (A.ctx && A.ctx.state === 'running') ? ['a', A.ctx.currentTime] : ['p', performance.now() / 1000];
  function clockStart() { const [src, n] = srcNow(); clock.base = S.t; clock.mark = n; clock.src = src; }
  function clockNow() { const [src, n] = srcNow(); if (src !== clock.src) { clock.base = S.t; clock.mark = n; clock.src = src; } return clock.base + (n - clock.mark); }

  // ---------- input
  const laneBtns = [...document.querySelectorAll('.lane')];
  function press(lane) {
    if (S.mode !== 'running' || S.gm < S.awakeUntil && S.rest) return;
    if (S.down[lane]) return;
    S.down[lane] = true; laneBtns[lane].classList.add('down');
    const lv = L(), now = S.t;
    let best = null, bd = 9;
    for (let i = Math.max(0, S.ni - 4); i < S.notes.length; i++) {
      const n = S.notes[i]; if (n.t - now > lv.win[1]) break;
      if (n.judged || n.lane !== lane) continue;
      const d = Math.abs(n.t - now); if (d < bd) { bd = d; best = n; }
    }
    emit('counter', lane);
    if (!best || bd > lv.win[1]) { if (S.rest) { S.depth += DEPTH.empty; S.quietAt = now; } sfx.buzz(at(now)); return; }
    judge(best, bd <= lv.win[0] ? 'perfect' : 'good');
    if (best.kind === 'hold') S.holdNote = best;
  }
  function release(lane) {

    ctx.beginPath(); ctx.moveTo(600, 440); ctx.quadraticCurveTo(640, 432, 660, 446); ctx.moveTo(700, 438); ctx.quadraticCurveTo(730, 440, 760, 448); ctx.stroke();
    ctx.strokeStyle = '#776e88'; ctx.beginPath(); ctx.moveTo(540, 434); ctx.bezierCurveTo(548, sh_ + 3, 574, sh_ + 1, 590, 427); ctx.stroke();
    // hand resting on the blanket edge by his chin
    ctx.fillStyle = uniform; ctx.fillRect(540, 432, 18, 8);
    ctx.fillStyle = skin; ctx.fillRect(532 + toss * 0.5, 432, 10, 8);
    // head in profile, facing the room
    const hx = 512 + toss, hy = 428;
    ctx.fillStyle = '#12150f'; ctx.beginPath(); ctx.ellipse(hx, hy, 15, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = skin; ctx.beginPath(); ctx.ellipse(hx, hy, 13, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(hx + 11, hy - 1, 4, 4);
    ctx.fillStyle = '#8f8a85'; ctx.beginPath(); ctx.ellipse(hx - 4, hy - 4, 11, 8, -0.3, Math.PI * 0.85, Math.PI * 1.95); ctx.fill();
    ctx.fillRect(hx - 13, hy - 4, 5, 9);
    ctx.fillStyle = '#a8876c'; ctx.fillRect(hx - 2, hy, 4, 4);
    ctx.strokeStyle = '#2a2420'; ctx.fillStyle = '#2a2420'; ctx.lineWidth = 2;
    if (asleep) { ctx.beginPath(); ctx.moveTo(hx + 4, hy - 2); ctx.lineTo(hx + 10, hy - 1); ctx.stroke(); }
    else { ctx.fillRect(hx + 6, hy - 4, 3, 3); }
    ctx.restore();
    if (asleep && running && Math.random() < 0.02) zs.push({ x: hx + 10, y: hy - 16, t0: T });
    for (let i = zs.length - 1; i >= 0; i--) {
      const z = zs[i], a = (T - z.t0) / 1.6; if (a > 1) { if (running) zs.splice(i, 1); continue; }
      ctx.globalAlpha = 0.7 * (1 - a); ctx.strokeStyle = C.sleep; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(z.x + a * 22, z.y - a * 50, 3 + a * 6, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawSheet() {
    ctx.fillStyle = 'rgba(8,9,9,0.74)'; ctx.fillRect(0, 0, VW, VH);
    ctx.save(); ctx.translate(VW / 2 - 40, VH / 2 - 20); ctx.rotate(-0.02);
    const W = 560, H = 300, x0 = -W / 2 + 40, x1 = W / 2 - 40, X = g => x0 + (x1 - x0) * g / 240;
    ctx.fillStyle = '#d8d3c4'; ctx.fillRect(-W / 2, -H / 2, W, H);
    ctx.fillStyle = 'rgba(230,220,180,0.6)'; ctx.fillRect(-46, -H / 2 - 12, 92, 22);
    ctx.fillStyle = '#4f4d46'; ctx.font = `700 22px ${SERIF}`; ctx.textAlign = 'center'; ctx.fillText('근무표', 0, -H / 2 + 46);
    ctx.fillStyle = '#8a8676'; for (let i = 0; i < 2; i++) ctx.fillRect(x0, -70 + i * 16, x1 - x0, 1.4);
    ctx.fillStyle = '#6b685e'; ctx.font = `600 14px ${MONO}`; ctx.textAlign = 'left'; ctx.fillText('휴게(무급)', x0, -12);
    ctx.fillStyle = '#b5b1a4'; ctx.fillRect(x0, 0, x1 - x0, 14);
    ctx.fillStyle = '#6b685e'; ctx.font = `500 11px ${MONO}`; ctx.textAlign = 'center';
    [0, 60, 120, 180, 240].forEach(g => { ctx.fillRect(X(g) - 0.5, 14, 1, 6); ctx.fillText(hm(g), X(g), 34); });
    // ruled lines, one per night; his pencil runs only where he actually slept
    for (let r = 0; r < LEVELS.length; r++) {
      const y = 62 + r * 20;
      ctx.fillStyle = '#c4bfae'; ctx.fillRect(x0, y + 4, x1 - x0, 1);
      const n = nightLog[r]; if (!n) continue;
      ctx.strokeStyle = '#55524b'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      let runStart = -1;
      for (let g = 0; g <= n.end; g++) {
        const on = g < n.end && n.sleep[g];
        if (on && runStart < 0) runStart = g;
        if (!on && runStart >= 0) {
          ctx.beginPath(); ctx.moveTo(X(n.from + runStart), y);
          for (let k = runStart; k <= g; k += 2) ctx.lineTo(X(n.from + k), y + Math.sin(k * 0.9 + r) * 1.1);
          ctx.lineTo(X(n.from + g) + 0.1, y); ctx.stroke(); runStart = -1;
        }
      }
      ctx.lineCap = 'butt';
    }
    ctx.restore();
    for (let i = 0; i < Math.min(7, slipsKept); i++) {
      ctx.save(); ctx.translate(VW - 110 - i * 104, VH - 64 + (i % 2) * 8); ctx.rotate(-0.12 + i * 0.1);
      ctx.fillStyle = '#efe9d6'; ctx.fillRect(-46, -30, 92, 60);
      ctx.fillStyle = '#d6cfb8'; ctx.fillRect(-46, -2, 92, 1.2);
      ctx.strokeStyle = '#7d776a'; ctx.lineWidth = 1.4; ctx.beginPath();
      for (let l = 0; l < 3; l++) { const yy = -16 + l * 11, len = [62, 70, 38][l]; ctx.moveTo(-34, yy); for (let q = 0; q <= len; q += 4) ctx.lineTo(-34 + q, yy + Math.sin(q * 0.7 + i + l) * 1.6); }
      ctx.stroke();
      ctx.restore();
    }
  }

  // ---------- loop and controls
  let lastFrame = performance.now();
  function frame(nowMs) {
    const rdt = Math.min(0.05, (nowMs - lastFrame) / 1000); lastFrame = nowMs;
    const before = S.t;
    if (S.mode === 'running') step();
    draw(S.mode === 'running' ? Math.max(0, S.t - before) || rdt : 0);
    requestAnimationFrame(frame);
  }
  function syncPlay() {
    const b = $('playBtn');
    b.textContent = S.mode === 'running' ? '❚❚' : '▶';
    b.setAttribute('aria-label', S.mode === 'running' ? '잠깐 멈춤' : '휴게 시작');
    b.disabled = S.mode === 'ended';
    laneBtns.forEach(x => { x.disabled = S.mode !== 'running'; });
  }
  function syncNights() {
    document.querySelectorAll('.night').forEach(btn => {
      const n = +btn.dataset.n;
      btn.disabled = n > unlocked;
      btn.setAttribute('aria-current', String(n === level));
      btn.classList.toggle('next', S.mode === 'ended' && n === unlocked && n !== level);
    });
  }
  function releaseAll() { for (let k = 0; k < 3; k++) { S.down[k] = false; laneBtns[k].classList.remove('down'); } S.holdNote = null; }
  function play() {
    if (S.mode === 'ended') return;
    audioInit();
    if (S.mode === 'running') { S.mode = 'paused'; releaseAll(); audioPause(true); }
    else { S.mode = 'running'; audioPause(false); clockStart(); S.started = true; }
    syncPlay(); syncPhone();
  }
  $('playBtn').addEventListener('click', play);
  $('muteBtn').addEventListener('click', e => {
    A.muted = !A.muted; e.currentTarget.setAttribute('aria-pressed', String(A.muted));
    e.currentTarget.setAttribute('aria-label', A.muted ? '소리 켜기' : '소리 끄기');
    $('muteWaves').style.opacity = A.muted ? 0.15 : 1;
    if (A.master) A.master.gain.value = A.muted ? 0 : 0.8;
  });
  function reset() {
    if (A.ctx) audioPause(true);
    S = fresh(); fx.length = 0; parts.length = 0; zs.length = 0; tuneStep = 0;
    laneBtns.forEach(b => b.classList.remove('down', 'cue'));
    syncPlay(); syncPhone(); syncNights(); draw(0);
  }
  $('resetBtn').addEventListener('click', reset);
  document.querySelectorAll('.night').forEach(btn => btn.addEventListener('click', () => { level = +btn.dataset.n; reset(); }));

  // input: lane buttons, the picture (tap at the height of the wave), or keys W/S/X, ↑/space/↓
  laneBtns.forEach((b, k) => {
    b.addEventListener('pointerdown', e => { e.preventDefault(); press(k); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => release(k)));
  });
  const toScene = e => { const r = cv.getBoundingClientRect(), k = r.width / VW; return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k - TB }; };
  const onPhone = q => q.x > PHONE.x - 24 && q.x < PHONE.x + PHONE.w + 24 && q.y > PHONE.y - 24 && q.y < PHONE.y + PHONE.h + 24;
  const ptrLane = new Map();
  cv.addEventListener('pointerdown', e => {
    const q = toScene(e);
    if (S.ring && onPhone(q)) { answer(); return; }
    if (q.y < 0) return;
    const lane = laneAt(q.y); ptrLane.set(e.pointerId, lane); press(lane);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cv.addEventListener(ev, e => { const lane = ptrLane.get(e.pointerId); if (lane !== undefined) { ptrLane.delete(e.pointerId); release(lane); } }));
  const KEYS = { KeyW: 0, ArrowUp: 0, KeyS: 1, Space: 1, ArrowRight: 1, ArrowLeft: 1, KeyX: 2, ArrowDown: 2 };
  window.addEventListener('keydown', e => { const k = KEYS[e.code]; if (k === undefined) return; e.preventDefault(); if (e.repeat) return; press(k); });
  window.addEventListener('keyup', e => { const k = KEYS[e.code]; if (k === undefined) return; e.preventDefault(); release(k); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'running') play(); });

  S = fresh(); syncPlay(); syncPhone(); syncNights();
  if (window.__QA) window.__QA = { get S() { return S; }, press, release, L };
  window.addEventListener('resize', fit);
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
